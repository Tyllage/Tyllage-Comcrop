name: Validate pilot release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tyllage
          POSTGRES_PASSWORD: tyllage_ci_only
          POSTGRES_DB: tyllage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tyllage -d tyllage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tyllage:tyllage_ci_only@localhost:5432/tyllage_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - name: Test business rules and migrations on disposable PostgreSQL
        run: npm test
      - name: Build production frontend
        run: npm run build
